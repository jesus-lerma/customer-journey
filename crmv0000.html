      ${walkin ? `
      <div class="field"><label>Categoría CDK *</label><select class="input" name="category"><option>Fresh Up</option><option>Be Back</option></select></div>
      <div class="field"><label>Asesor asignado (turno)</label><select class="input" name="asesor">${FLOOR_AGENTS.map(a => `<option>${a}</option>`).join('')}</select></div>
      <div class="field full"><label>¿Por qué medio se enteró de nosotros? (F018)</label><select class="input" name="need"><option>Pasaba por la agencia</option><option>Redes sociales</option><option>Recomendación</option><option>Sitio web</option></select></div>` : `
      <div class="field"><label>Fuente *</label><select class="input" name="source">${SOURCES.map(s => `<option ${s === 'web_form' ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      <div class="field"><label>Formulario (form_name) *</label><select class="input" name="form_name" data-action="form-change">${Object.keys(FORM_INTENT).filter(k => !k.startsWith('PISO')).map(k => `<option>${k}</option>`).join('')}</select><span class="hint">lead_intent: <b id="intent">inquiry</b></span></div>
      <div class="field"><label>ID externo (source_id)</label><input class="input" name="external_id" placeholder="Para reconciliar"></div>
      <div class="field"><label>utm_source</label><input class="input" name="utm_source" placeholder="google, facebook…"></div>`}
    </div>
    <div id="dupe"></div>
    <details><summary class="small" style="cursor:pointer;font-weight:600">Ver payload que se enviará al middleware</summary><div class="json" id="payload" style="margin-top:8px"></div></details>`,
    `<span class="small muted" style="margin-right:auto">Datos ficticios · no captures PII real en pruebas</span><button class="btn ghost" data-action="close">Cancelar</button><button class="btn" data-action="save-lead" data-walkin="${walkin ? 1 : 0}">${walkin ? 'Registrar y asignar' : 'Crear lead'}</button>`);
  updateLeadPreview();
}
/** Recalcula payload, intent y posible duplicado mientras el usuario escribe. */
function formData() { const o = {}; document.querySelectorAll('#modal [name]').forEach(i => o[i.name] = i.value.trim()); return o; }
function updateLeadPreview() {
  const f = formData(); if (!f.brand) return;
  if (!f.source) { f.source = 'at_plus_piso'; f.form_name = 'PISO - WALK IN'; }
  const p = MW.payload(f);
  const pay = $('#payload'); if (pay) pay.textContent = 'POST /webhooks/at_plus\nAuthorization: Bearer ••••••• (gestor de secretos)\n\n' + JSON.stringify(p, null, 2);
  const it = $('#intent'); if (it) it.textContent = FORM_INTENT[f.form_name] || 'inquiry';
  const hint = $('#contact-hint'); if (hint) { const bad = !p.phone && !p.email; hint.className = 'full hint ' + (bad ? 'err' : ''); }
  const m = state.leads.find(l => (p.phone && l.phone === p.phone) || (p.email && l.email === p.email));
  $('#dupe').innerHTML = m ? `<div class="alert warn">${icon('users')}<div>Contacto existente: <b>${esc(fullName(m))}</b> · ${state.leads.filter(x => x.unique_contact_id === m.unique_contact_id).length} lead(s) previos. Se creará un lead nuevo ligado al mismo <span class="mono">unique_contact_id</span>.</div></div>` : '';
}

function openAppt(l) {
  const d = new Date(Date.now() + 86400000); d.setHours(11, 0, 0, 0);
  const local = new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  modal('Agendar cita', `
    <div class="form-grid">
      <div class="field"><label>Fecha y hora (F089) *</label><input class="input" type="datetime-local" name="at" value="${local}"></div>
      <div class="field"><label>Tipo</label><select class="input" name="kind"><option>Visita</option><option>Videollamada</option><option>Prueba de manejo</option><option>Entrega</option></select></div>
      <div class="field"><label>Agencia</label><input class="input" value="${esc(l.agency)}" readonly></div>
      <div class="field"><label>Asesor de sucursal (F017)</label><select class="input" name="asesor">${FLOOR_AGENTS.map(a => `<option>${a}</option>`).join('')}</select></div>
      <label class="small full" style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="pm" checked> Ofrecer prueba de manejo (F090)</label>
      <label class="small full" style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="loc" checked> Enviar ubicación de la agencia (F092)</label>
    </div>
    <div class="alert info">${icon('chat')}<div>Al guardar: <span class="mono">POST /api/v1/appointments</span> genera el folio y se envía la confirmación C2 por Vambe + correo. Los recordatorios D-1 (C3) y mismo día (C4) ya están automatizados.</div></div>`,
    `<button class="btn ghost" data-action="close">Cancelar</button><button class="btn" data-action="save-appt" data-id="${l.id}">Agendar y confirmar</button>`);
}

/* ============================================================================
   Q. ACCIONES (delegación de eventos)
   ============================================================================ */
function toast(msg, kind = 'ok') {
  const el = document.createElement('div'); el.className = 'toast ' + kind;
  el.innerHTML = icon(kind === 'ok' ? 'check' : 'alert') + `<span>${msg}</span>`;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), 3800);
}
const log = (l, txt, who) => l.activity.push({ ts: Date.now(), who: who || ROLES.find(r => r.key === state.role).user, txt });
const getLead = id => state.leads.find(l => l.id === id);
function go(view, extra = {}) { Object.assign(state, { view }, extra); render(); window.scrollTo(0, 0); }

/** Mueve un lead de etapa, avisando si faltan campos del rol activo. */
function moveStage(l, to) {
  if (to === l.stage) return;
  const c = completion(l); c.pct = c.pct ?? 100;
  const from = STAGES[l.stage].name;
  l.stage = to;
  if (to >= 2) l.cadenceOutcome = 'contactado';
  log(l, `Etapa <b>${esc(from)}</b> → <b>${esc(STAGES[to].name)}</b>${c.pct < 100 ? ` · ${c.total - c.done} campos sin capturar` : ''}`);
  toast(`${esc(fullName(l))} → ${esc(STAGES[to].name)}${c.pct < 100 ? ` · faltan ${c.total - c.done} campos` : ''}`, c.pct < 100 ? 'err' : 'ok');
}

const ACTIONS = {
  go: (d) => go(d.view, d.view === 'leads' ? {} : {}),
  role: (d) => { state.role = d.role; state.view = ROLES.find(r => r.key === d.role).home; render(); toast(`Vista de ${d.role}`); },
  open: (d) => go('lead', { leadId: d.id, leadTab: 'accion', captureScope: 'stage' }),
  tab: (d) => { state.leadTab = d.tab; render(); },
  scope: (d) => { state.captureScope = d.scope; render(); },
  mod: (d, el) => el.closest('.mod').classList.toggle('closed'),
  'new-lead': () => openNewLead(false),
  walkin: () => openNewLead(true),
  close: () => closeModal(),
  'close-bg': (d, el, ev) => { if (ev.target === el) closeModal(); },
  advance: (d) => { const l = getLead(d.id); moveStage(l, l.stage + 1); render(); },
  jump: (d) => { const l = getLead(d.id); moveStage(l, +d.stage); render(); },
  /** Transversal: vacío → en curso → completo → vacío */
  tv: (d) => { const l = getLead(d.id); const cur = l.tv[d.tv]; l.tv[d.tv] = cur === '' ? 'on' : cur === 'on' ? 'ok' : ''; const t = TRANSVERSALS.find(x => x.key === d.tv); log(l, `Transversal <b>${t.name}</b>: ${l.tv[d.tv] === 'ok' ? 'completo' : l.tv[d.tv] ? 'en curso' : 'sin iniciar'}`); if (l.tv[d.tv] === 'on') { state.leadTab = 'captura'; state.captureScope = d.tv === 'exp' ? 'stage' : d.tv; if (d.tv === 'exp') state.leadTab = 'expediente'; } render(); },
  /** Resultado de una llamada de la cadencia */
  outcome: (d) => {
    const l = getLead(d.id), a = nextAction(l); l.done.add(a.touch.key);
    // ¿El toque actual pertenece a la cadencia de 35 días? (los de No Show / piso no avanzan la cadencia)
    const isCad = CADENCE[l.cadenceIdx]?.touch?.key === a.touch.key;
    if (d.out === 'contactado' && a.touch.id.startsWith('NS')) {
      log(l, `${a.touch.id} No show: <b>contactado</b> → reagendar`); render(); toast('Cliente localizado: reagenda la cita'); return openAppt(l);
    }
    if (d.out === 'contactado') {
      l.cadenceOutcome = 'contactado'; if (l.stage === 0) l.stage = 1;
      if ((Date.now() - l.created) / 60000 <= 10) l.fields.F069 = 'Sí';
      log(l, `${a.touch.id} llamada: <b>contactado</b>`); toast('Contacto efectivo. Siguiente: diferenciadores de marca (L20) y cita.');
    } else if (d.out === 'no_contesta') {
      if (isCad) l.cadenceIdx++;
      if (l.stage === 0) l.stage = 1;
      const nx = nextAction(l);
      log(l, `${a.touch.id} llamada: <b>no contesta</b>${nx?.touch ? ` → siguiente toque ${nx.touch.id}` : ''}`); toast(`Registrado. Siguiente: ${nx?.touch?.t || nx?.label || 'fin de ciclo'}`);
    } else { l.status = 'descartado'; log(l, 'Número equivocado → <b>Descartado</b>'); toast('Lead descartado', 'err'); }
    render();
  },
  'send-wa': (d) => {
    const l = getLead(d.id), t = DATA.touches[+d.touch]; const r = MW.sendVambe(l, t); l.done.add(t.key);
    if (CADENCE[l.cadenceIdx]?.touch?.key === t.key) l.cadenceIdx++;
    if (t.id === 'L20') { ['F070','F071','F072'].forEach(k => l.fields[k] = 'Sí'); }
    log(l, `Plantilla Vambe <b>${t.id}</b> enviada (relay ${r.relay.id.slice(0, 8)}, HTTP 202)`); toast(`Plantilla ${t.id} enviada a Vambe (202 Accepted)`); render();
  },
  done: (d) => { const l = getLead(d.id), t = DATA.touches[+d.touch]; l.done.add(t.key); if (CADENCE[l.cadenceIdx]?.touch?.key === t.key) l.cadenceIdx++; log(l, `Toque <b>${t.id}</b> realizado`); toast(`${t.id} marcado como realizado`); render(); },
  discard: (d) => { const l = getLead(d.id); l.status = 'descartado'; l.done.add(CADENCE[18].touch.key); log(l, 'Fin del ciclo de 35 días → <b>Descartado/Retenido</b> (L19)'); toast('Lead descartado; sale del journey', 'err'); render(); },
  'log-call': (d) => { const l = getLead(d.id); log(l, `Llamada manual a ${esc(l.phone)}`); toast(`Marcando a ${esc(l.phone)}… (click-to-call simulado)`); render(); },
  'wa-free': (d) => { const l = getLead(d.id); MW.sendVambe(l, null); log(l, 'Mensaje libre por Vambe'); toast('Mensaje enviado a Vambe (202)'); render(); },
  appt: (d) => openAppt(getLead(d.id)),
  'save-appt': (d) => {
    const l = getLead(d.id), f = formData(); const at = new Date(f.at).getTime();
    const r = MW.createAppointment(l, at, f.kind); l.asesor = f.asesor; l.fields.F017 = f.asesor; l.fields.F089 = f.at; l.fields.F095 = r.confirmation_code;
    if (l.stage < 2) l.stage = 2; l.cadenceOutcome = 'contactado';
    const c2 = DATA.touches.find(t => t.id === 'C2'); l.done.add(c2.key); MW.sendVambe(l, c2);
    log(l, `Cita <b>${r.confirmation_code}</b> agendada ${fmtDate(at)} · confirmación C2 enviada`); closeModal(); toast(`Cita ${r.confirmation_code} agendada y confirmada por Vambe`); render();
  },
  checkin: (d) => {
    const l = getLead(d.id); if (!l.appt) return; MW.checkIn(l, ROLES[1].user);
    l.stage = Math.max(l.stage, 3); ['P1','P2'].forEach(id => DATA.touches.filter(t => t.id === id).forEach(t => l.done.add(t.key)));
    l.fields.F008 = l.fields.F008 || 'Sí'; log(l, `Check-in con folio <b>${l.appt.code}</b> (POST …/check_in)`); toast(`${esc(fullName(l))} llegó · asigna asesor`); go('lead', { leadId: l.id, leadTab: 'accion' });
  },
  'find-code': () => {
    const v = ($('#code').value || '').trim().toUpperCase(); const ph = normPhone(v);
    const l = state.leads.find(x => (x.appt && x.appt.code === v) || (ph && x.phone === ph));
    if (!l) return toast('No se encontró la cita. Registra como walk-in.', 'err');
    if (l.appt && l.appt.status === 'scheduled') ACTIONS.checkin({ id: l.id }); else go('lead', { leadId: l.id });
  },
  assign: (d) => { const l = getLead(d.id); l.asesor = d.asesor; l.fields.F017 = d.asesor; DATA.touches.filter(t => t.id === 'P3').forEach(t => l.done.add(t.key)); moveStage(l, 4); log(l, `Asesor asignado: <b>${esc(d.asesor)}</b> (P3)`); render(); },
  doc: (d, el) => { const l = getLead(d.id); el.checked ? l.docs.add(d.doc) : l.docs.delete(d.doc); if (!l.tv.exp) l.tv.exp = 'on'; if (l.docs.size === 41) l.tv.exp = 'ok'; render(); },
  yn: (d) => { const l = getLead(d.id); l.fields[d.field] = l.fields[d.field] === d.val ? '' : d.val; render(); },
  allfields: (d, el) => { state.showAllFields = el.checked; render(); },
  retry: (d) => { const l = getLead(d.id); MW.dispatch(l, d.crm); log(l, `Reintento de despacho a <b>${d.crm}</b>`, 'Sistema'); toast(`Reintentando ${d.crm}…`); render(); },
  tradein: (d) => {
    const l = getLead(d.id); const r = MW.quoteTradeIn({ year: l.fields.F086 || '2021', km: l.fields.F087 || 60000 });
    l.fields.F088 = 'Sí'; log(l, `Cotización de toma (referencial): $${r.min.toLocaleString('es-MX')} – $${r.max.toLocaleString('es-MX')}`);
    toast(`Toma referencial: $${r.min.toLocaleString('es-MX')} – $${r.max.toLocaleString('es-MX')}. Validar con Ventas.`); render();
  },
  'save-lead': (d) => {
    const f = formData(); const walkin = d.walkin === '1';
    if (!f.first) return toast('El nombre es obligatorio', 'err');
    if (walkin) Object.assign(f, { source: 'at_plus_piso', form_name: 'PISO - WALK IN', stage: 3 });  // entra a En Recepción; avanzar = Atendido
    const r = MW.createLead(f);
    if (r.body.status === 'ignored') return toast('Sin teléfono ni correo: el middleware lo ignoraría. Captura al menos uno.', 'err');
    if (walkin) { r.lead.bdc = '—'; r.lead.cadenceOutcome = 'contactado'; DATA.touches.filter(t => ['P1','P2','P3'].includes(t.id) && t.stage === 'En Recepción').forEach(t => r.lead.done.add(t.key)); log(r.lead, `Walk-in registrado por hostess · asesor <b>${esc(f.asesor)}</b>`); }
    closeModal(); toast(`Lead creado · lead_id ${r.body.lead_id.slice(0, 8)}… (201). Despachando a CRMs…`);
    go('lead', { leadId: r.lead.id, leadTab: walkin ? 'captura' : 'accion', captureScope: 'stage' });
  },
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-action]'); if (!el) return;
  // Evita que el click en un botón dentro de una fila clickeable abra también la ficha
  if (el.tagName !== 'INPUT' && el.dataset.action !== 'close-bg') ev.stopPropagation();
  const fn = ACTIONS[el.dataset.action]; if (fn && !(el.tagName === 'SELECT')) fn(el.dataset, el, ev);
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.filter) { state.filters[el.dataset.filter] = el.value; render(); }
  if (el.dataset.jfilter) { state.journeyFilter[el.dataset.jfilter] = el.value; render(); }
  if (el.dataset.ffilter && el.tagName === 'SELECT') { state.fieldFilter[el.dataset.ffilter] = el.value; render(); }
  if (el.dataset.field) { const l = getLead(el.dataset.id); l.fields[el.dataset.field] = el.value; if (el.dataset.field === 'F021') l.temp = el.value; render(); }
  if (el.dataset.action === 'brand-change') { $('#modal [name=model]').innerHTML = BRANDS[el.value].map(m => `<option>${m}</option>`).join(''); }
  if ($('#modal').innerHTML) updateLeadPreview();
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.id === 'q') { state.q = el.value; if (!['leads','pipeline'].includes(state.view)) state.view = 'leads'; render(); const q = $('#q'); q.focus(); }
  if (el.dataset.ffilter === 'q') { state.fieldFilter.q = el.value; render(); const i = document.querySelector('[data-ffilter=q]'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  if (el.closest('#modal')) updateLeadPreview();
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeModal(); });
// Drag & drop del pipeline
document.addEventListener('dragstart', ev => { const c = ev.target.closest('[data-drag]'); if (c) ev.dataTransfer.setData('text/plain', c.dataset.drag); });
document.addEventListener('dragover', ev => { const c = ev.target.closest('[data-drop]'); if (c) { ev.preventDefault(); c.classList.add('drop'); } });
document.addEventListener('dragleave', ev => { const c = ev.target.closest('[data-drop]'); if (c) c.classList.remove('drop'); });
document.addEventListener('drop', ev => { const c = ev.target.closest('[data-drop]'); if (!c) return; ev.preventDefault(); const l = getLead(ev.dataTransfer.getData('text/plain')); if (l) { moveStage(l, +c.dataset.drop); render(); } });
// Reloj: refresca los contadores de SLA cada 30 s en las vistas de cola
setInterval(() => { if (['home','leads','pipeline'].includes(state.view) && !$('#modal').innerHTML && document.activeElement?.id !== 'q') render(); }, 30000);

/* ============================================================================
   R. ARRANQUE
   ============================================================================ */
seed();
render();
</script>
</body>
</html>
