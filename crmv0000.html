<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AT+ CRM Maqueta</title>
<!--
  ============================================================================
  AT+ CRM — Maqueta v1 (prototipo navegable, sin backend)
  ----------------------------------------------------------------------------
  Objetivo: mostrar cómo un CRM construido desde cero puede operar el
  "Journey comercial + campos por objeto" (journey.html) de punta a punta:
    Nuevo → En Contacto → Cita Programada → En Recepción → Atendido por un
    asesor → Cotización → Pedido → Facturación → Entrega
  + transversales (Apartado, Prueba de manejo, Financiamiento, Auto a cuenta,
    Expediente digital, Logística).

  Fuentes de verdad usadas:
    1. journey.html  → 199 campos (F001–F199) con etapa y rol, 74 toques de
                        contacto (Contact Plan CDK, Touch Points Piso, Creatio).
                        Se incrustan tal cual en <script id="journey-data">.
    2. leads-api.md  → contratos del lead-capture-middleware (creación de
                        leads, crm_dispatches, citas, mensajes Vambe, cotización
                        de toma). Aquí se SIMULAN; no se hace ninguna llamada real.
    3. Figma "handoff-multimarcas" (frame handOff AUTOCOM) → tokens de color,
                        tipografía (Inter), botones, sidebar negro con ítem rojo,
                        tabs con subrayado rojo, alertas y barras de progreso.

  Arquitectura del archivo (vanilla JS, un solo archivo, sin dependencias):
    - CSS tokens (:root) ............ sistema de diseño AUTOCOM
    - DATA ........................... journey parseado (campos + toques)
    - Catálogos ...................... etapas, roles, cadencia 35 días, fuentes
    - Estado (state) ................. leads simulados en memoria
    - Simulador middleware (MW) ...... crea lead, despacha a CRMs, Vambe, citas
    - Vistas (render*) ............... Mi día, Leads, Pipeline, Ficha 360,
                                       Recepción, Agenda, Journey, Integraciones,
                                       Diccionario de campos
    - Eventos ........................ delegación por atributos data-action

  ⚠️ Todos los datos de clientes son FICTICIOS (política de privacidad AUTOCOM).
  ============================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Inter = fuente de cuerpo del sistema de diseño. Poppins se usa como sustituto
     visual de "Nissan Brand" (fuente propietaria de títulos en el Figma). -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
   1. TOKENS — tomados del Figma (handOff AUTOCOM → 2. Color / 1. Tipografía)
   --------------------------------------------------------------------------- */
:root{
  /* Primario */
  --ink:#040404;          /* Autocom / negro web */
  --red:#AF0F2B;          /* Autocom / Rojo web (acento principal) */
  --red-hover:#D0112F;    /* estado Hover de botón primario */
  --red-50:#FBEFF1;       /* fondo suave para selección / activo */
  --gray:#6A7282;         /* gris primario */
  /* Neutrales */
  --n-900:#040404; --n-700:#333333; --n-600:#555555; --n-500:#696969;
  --line:#D1D5DC; --bg:#F9FAFB; --bg-warm:#FBF9F9; --white:#FFFFFF;
  /* Estados (alertas del sistema) */
  --success:#16A34A; --success-50:#ECFDF3;
  --warning:#F59E0B; --warning-50:#FFFBEB;
  --error:#DC2626;   --error-50:#FEF2F2;
  --info:#2563EB;    --info-50:#EFF6FF;
  /* Colores por rol (heredados de journey.html para mantener la misma lectura) */
  --r-bdc:#2F80ED; --r-host:#169C89; --r-apv:#E5902A; --r-fi:#B45309;
  --r-sys:#697386; --r-ger:#7C3AED; --transversal:#7C3AED;
  /* Espaciado 8pt + radios */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --radius:4px; --radius-lg:8px;
  --shadow:0 1px 2px rgba(4,4,4,.06),0 4px 16px rgba(4,4,4,.06);
  --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  --font-title:'Poppins','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14px;line-height:20px;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-title);margin:0;letter-spacing:0}
h1{font-size:24px;line-height:32px;font-weight:600}
h2{font-size:18px;line-height:28px;font-weight:600}
h3{font-size:15px;line-height:22px;font-weight:600}
.muted{color:var(--gray)} .small{font-size:12px;line-height:16px} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}

/* ---------------------------------------------------------------------------
   2. LAYOUT — sidebar negro (Figma 7.5 Sidebar menu) + contenido
   --------------------------------------------------------------------------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.sidebar{background:var(--ink);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:20px 20px 16px}
.brand-logo{background:var(--red);color:#fff;font-family:var(--font-title);font-weight:700;font-size:14px;letter-spacing:.5px;padding:4px 8px;border-radius:2px}
.brand small{color:#9CA3AF;font-size:11px;display:block;line-height:14px}
.nav{padding:8px 12px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav-label{color:#6B7280;font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:14px 10px 6px}
.nav button{all:unset;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--radius);cursor:pointer;color:#E5E7EB;font-size:14px}
.nav button:hover{background:#1A1A1A}
.nav button.active{background:var(--red);color:#fff}
.nav .count{margin-left:auto;background:#262626;color:#fff;border-radius:999px;font-size:11px;padding:0 7px;line-height:18px}
.nav button.active .count{background:rgba(255,255,255,.22)}
.side-foot{padding:14px 20px;border-top:1px solid #1F1F1F;font-size:11px;color:#9CA3AF}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 24px}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--radius);padding:0 12px;height:38px;background:var(--bg)}
.search input{border:0;outline:0;background:transparent;flex:1;height:100%}
.role-switch{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.role-switch button{all:unset;cursor:pointer;padding:0 12px;height:36px;display:flex;align-items:center;font-size:13px;font-weight:500;border-right:1px solid var(--line)}
.role-switch button:last-child{border-right:0}
.role-switch button.active{background:var(--ink);color:#fff}
.me{display:flex;align-items:center;gap:8px;font-size:13px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--red-50);color:var(--red);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.content{padding:24px;display:flex;flex-direction:column;gap:16px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head p{margin:4px 0 0}

/* ---------------------------------------------------------------------------
   3. COMPONENTES — botones (Figma 5), inputs (Figma 6), tabs (Figma 7.4),
      alertas (Figma 7.1), barra de progreso (Figma 7.2), chips
   --------------------------------------------------------------------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--radius);border:1px solid var(--red);background:var(--red);color:#fff;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--red-hover);border-color:var(--red-hover)}
.btn:disabled{background:#E5E7EB;border-color:#E5E7EB;color:#9CA3AF;cursor:not-allowed}
.btn.secondary{background:#fff;color:var(--red)}
.btn.secondary:hover{background:var(--red-50)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--bg)}
.btn.dark{background:var(--ink);border-color:var(--ink)}
.btn.success{background:var(--success);border-color:var(--success)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.pill{border-radius:999px}
.icon-btn{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:var(--radius);color:var(--gray)}
.icon-btn:hover{background:var(--bg);color:var(--ink)}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid #EEF0F3}
.card-b{padding:16px}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--n-700);display:flex;gap:6px;align-items:center}
.input,select.input,textarea.input{height:38px;border:1px solid var(--line);border-radius:var(--radius);padding:0 12px;background:#fff;outline:0;width:100%}
textarea.input{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
.input:hover{border-color:#9CA3AF}
.input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(4,4,4,.08)}
.input.error{border-color:var(--error);color:var(--error)}
.input[readonly],.input:disabled{background:#F3F4F6;color:var(--gray)}
.hint{font-size:12px;color:var(--gray)} .hint.err{color:var(--error)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-size:13px;font-weight:500;color:var(--gray);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button.active{color:var(--red);border-bottom-color:var(--red)}
.tabs .badge{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 6px;font-size:11px;line-height:16px;color:var(--n-700)}

.alert{display:flex;gap:10px;padding:10px 12px;border-radius:var(--radius);border:1px solid;font-size:13px;align-items:flex-start}
.alert.info{background:var(--info-50);border-color:#BFDBFE;color:#1E3A8A}
.alert.warn{background:var(--warning-50);border-color:#FDE68A;color:#78350F}
.alert.err{background:var(--error-50);border-color:#FECACA;color:#7F1D1D}
.alert.ok{background:var(--success-50);border-color:#BBF7D0;color:#14532D}

.progress{height:6px;background:#E5E7EB;border-radius:999px;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--red);border-radius:999px}
.progress.ok>span{background:var(--success)}

.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;line-height:18px;font-weight:600;background:#fff;color:var(--n-700);white-space:nowrap}
.chip.red{background:var(--red-50);border-color:#F3C2CB;color:var(--red)}
.chip.ok{background:var(--success-50);border-color:#BBF7D0;color:#166534}
.chip.warn{background:var(--warning-50);border-color:#FDE68A;color:#92400E}
.chip.err{background:var(--error-50);border-color:#FECACA;color:#991B1B}
.chip.info{background:var(--info-50);border-color:#BFDBFE;color:#1E40AF}
.chip.tv{background:#F5F3FF;border-color:#DDD6FE;color:#5B21B6}
.chip.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.role{display:inline-flex;font-size:10px;font-weight:700;padding:0 6px;line-height:16px;border-radius:3px;color:#fff}
.role.BDC{background:var(--r-bdc)} .role.Hostess{background:var(--r-host)} .role.APV{background:var(--r-apv)}
.role.FI{background:var(--r-fi)} .role.Sistema{background:var(--r-sys)} .role.Gerencia{background:var(--r-ger)}
.role.ro{opacity:.55}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.success{background:var(--success)} .dot.pending{background:var(--warning)} .dot.failed{background:var(--error)} .dot.skipped{background:#9CA3AF}
.temp{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600}
.temp.Caliente{color:var(--error)} .temp.Tibio{color:#D97706} .temp.Frío{color:var(--info)}

/* ---------------------------------------------------------------------------
   4. VISTAS
   --------------------------------------------------------------------------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{padding:14px 16px}
.kpi b{display:block;font-family:var(--font-title);font-size:26px;line-height:32px}
.kpi span{font-size:12px;color:var(--gray);font-weight:500}
.kpi.alertk b{color:var(--red)}
.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

/* Cola de trabajo */
.task{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid #EEF0F3;cursor:pointer}
.task:hover{background:var(--bg-warm)}
.task:last-child{border-bottom:0}
.ch-ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.ch-ico.call{background:var(--info-50);color:var(--info)}
.ch-ico.wa{background:var(--success-50);color:var(--success)}
.ch-ico.mail{background:#F5F3FF;color:var(--r-ger)}
.ch-ico.person{background:var(--warning-50);color:#B45309}
.ch-ico.admin{background:#F3F4F6;color:var(--gray)}
.task-t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.sla{font-variant-numeric:tabular-nums;font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select.input{width:auto;height:34px;font-size:13px}

/* Tablas */
.table-wrap{overflow:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--gray);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:#FCFCFD;white-space:nowrap;position:sticky;top:0}
table.t td{padding:10px 12px;border-bottom:1px solid #EEF0F3;vertical-align:middle}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--bg-warm)}
.who{display:flex;gap:10px;align-items:center}
.who b{display:block;font-weight:600}

/* Pipeline */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:250px;gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:#F3F4F6;border-radius:var(--radius-lg);display:flex;flex-direction:column;min-height:420px}
.col-h{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px}
.col-h .obj{font-size:10px;color:var(--gray);font-weight:500;display:block}
.col-b{padding:0 8px 8px;display:flex;flex-direction:column;gap:8px;flex:1}
.col.drop{outline:2px dashed var(--red);outline-offset:-4px}
.lcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:10px 12px;cursor:grab;display:flex;flex-direction:column;gap:6px}
.lcard:hover{border-color:var(--ink)}
.lcard .row{display:flex;justify-content:space-between;gap:6px;align-items:center}

/* Ficha 360 */
.lead-head{padding:16px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lead-head .big{width:52px;height:52px;font-size:18px}
.lead-head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.stepper{display:flex;padding:0 20px 16px;gap:0;overflow-x:auto}
.step{flex:1;min-width:104px;position:relative;text-align:center;font-size:11px;font-weight:600;color:var(--gray);padding-top:26px;cursor:pointer}
.step::before{content:"";position:absolute;top:9px;left:0;right:0;height:3px;background:#E5E7EB}
.step:first-child::before{left:50%} .step:last-child::before{right:50%}
.step i{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:17px;height:17px;border-radius:50%;background:#fff;border:3px solid #D1D5DB;z-index:1}
.step.done{color:var(--ink)} .step.done::before{background:var(--ink)} .step.done i{background:var(--ink);border-color:var(--ink)}
.step.cur{color:var(--red)} .step.cur::before{background:linear-gradient(90deg,var(--ink) 50%,#E5E7EB 50%)} .step.cur i{border-color:var(--red);background:#fff;box-shadow:0 0 0 4px var(--red-50)}
.step small{display:block;font-weight:500;color:#9CA3AF;font-size:10px}
.tv-row{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 16px;align-items:center}
.tv{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:1px dashed #C4B5FD;border-radius:999px;padding:3px 10px;font-size:12px;color:#5B21B6;background:#fff}
.tv.on{border-style:solid;background:#F5F3FF}
.tv.ok{border-style:solid;border-color:#BBF7D0;background:var(--success-50);color:#166534}
.lead-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.nba{border:1px solid var(--ink);border-radius:var(--radius-lg);overflow:hidden;background:#fff}
.nba-h{background:var(--ink);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px}
.nba-b{padding:16px;display:flex;flex-direction:column;gap:12px}
.script{background:var(--bg-warm);border-left:3px solid var(--red);padding:10px 12px;border-radius:0 var(--radius) var(--radius) 0;font-size:13px;white-space:pre-wrap}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--gray)} .kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.mod{border:1px solid var(--line);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden}
.mod-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#FCFCFD;border-bottom:1px solid #EEF0F3;cursor:pointer;gap:8px}
.mod-b{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;padding:14px}
.mod.closed .mod-b{display:none}
.toggle{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;width:max-content}
.toggle button{all:unset;cursor:pointer;padding:0 14px;height:34px;display:flex;align-items:center;font-size:13px;border-right:1px solid var(--line)}
.toggle button:last-child{border-right:0}
.toggle button.on{background:var(--red);color:#fff}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:500;background:#fff}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg button.tvb.on{background:var(--transversal);border-color:var(--transversal)}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:28px 1fr;gap:10px;padding-bottom:14px;position:relative}
.tl::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:#EEF0F3}
.tl:last-child::before{display:none}
.tl .b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:#fff;color:var(--gray)}
.tl.done .b{background:var(--ink);border-color:var(--ink);color:#fff}
.tl.next .b{border-color:var(--red);color:var(--red);box-shadow:0 0 0 4px var(--red-50)}
.tl.skip .b{background:#F3F4F6}
.doc{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F3F4F6;font-size:13px}
.doc input{width:16px;height:16px;accent-color:var(--red)}
.json{background:#0B0B0B;color:#E5E7EB;border-radius:var(--radius);padding:12px;font-size:12px;overflow:auto;max-height:280px;white-space:pre}
.cad{display:grid;grid-template-columns:repeat(35,minmax(0,1fr));gap:2px}
.cad div{height:28px;border-radius:2px;background:#F3F4F6;display:grid;place-items:center;font-size:9px;color:#9CA3AF;position:relative}
.cad div.has{background:#fff;border:1px solid var(--line);color:var(--ink)}
.cad div.call::after,.cad div.wa::before{content:"";position:absolute;width:6px;height:6px;border-radius:50%;bottom:2px}
.cad div.call::after{background:var(--info);left:3px}
.cad div.wa::before{background:var(--success);right:3px}
.cad div.today{outline:2px solid var(--red)}
.touch{border:1px solid var(--line);border-radius:var(--radius-lg);background:#fff}
.touch summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px}
.touch summary::-webkit-details-marker{display:none}
.touch .tid{font-family:var(--font-title);font-weight:700;color:var(--red)}
.touch .tb{padding:0 14px 14px 70px;display:grid;gap:10px;font-size:13px}
.matrix td.c{text-align:center;padding:6px 4px}
.matrix th.c{text-align:center;writing-mode:vertical-rl;transform:rotate(180deg);height:120px;padding:8px 4px}
.matrix th.tvh,.matrix td.tvh{background:#FAF8FF}

/* Modal + toasts */
.modal-bg{position:fixed;inset:0;background:rgba(4,4,4,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:var(--radius-lg);width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.25)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-b{padding:20px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;align-items:center}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.form-grid .full{grid-column:1/-1}
.section-t{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--gray);font-weight:700;margin-bottom:-4px}
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:var(--radius);font-size:13px;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;max-width:380px;animation:in .2s ease}
.toast.ok svg{color:#4ADE80} .toast.err svg{color:#F87171}
@keyframes in{from{transform:translateY(8px);opacity:0}}
.empty{padding:32px;text-align:center;color:var(--gray)}

/* Responsivo: el CRM es desktop-first; en pantallas chicas el sidebar se vuelve barra superior */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-2,.lead-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}.sidebar{position:static;height:auto}.nav{flex-direction:row;overflow-x:auto}.nav button{white-space:nowrap;flex:none}.nav-label,.side-foot{display:none}
  .role-switch{max-width:100%;overflow-x:auto}.search{max-width:none;flex-basis:100%}.lead-head .acts{margin-left:0}.page-head .filters{width:100%}
  .topbar{flex-wrap:wrap;padding:12px 16px}.content{padding:16px}.kpis{grid-template-columns:repeat(2,1fr)}
  .form-grid,.mod-b,.grid-3{grid-template-columns:1fr}.me span{display:none}
}
</style>
</head>

 Sra. (Primer nombre del cliente). Hemos recibido su petición en cuanto a (Vehículo de interés, año, modelo, marca, tipo), este auto es una estupenda elección. Estaremos en contacto con usted. ¡Gracias! (Nombre del Asesor Digital)"},{"stage":"En Contacto","channel":"Llamada","src":"Contact Plan CDK","brand":"Multimarca","id":"L3","t":"Reintento Telefónico (Día 2)","when":"Día 2 — 2 llamadas dobles","Momento / condición":"Lead digital CDK","Objetivo":"El cliente siente seguimiento proactivo sin sentirse presionado. Registro CRM: marcar intento y resultado del Día 2.","CTA / salida":"Agendar cita o confirmar mejor horario de contacto","Guión / llamada":"Mensaje sugerido (11 Principios de Respuesta BDC): reafirme el vehículo de interés, genere expectativa profesional, pregunte por el mejor momento (hoy o mañana) para agendar."},{"stage":"Nuevo / En Contacto","channel":"Vambe / WhatsApp","src":"Contact Plan CDK","brand":"Multimarca","id":"L4","t":"WhatsApp Vambe — Plantilla Concienzudo (Día 2)","when":"Día 2 — inmediatamente después de las llamadas sin respuesta","Momento / condición":"Lead digital CDK","Objetivo":"El cliente percibe atención cuidadosa y respeto por su ritmo de decisión. Registro CRM: marcar envío de plantilla Concienzudo.","CTA / salida":"Responder el mensaje o indicar disponibilidad","Mensaje / plantilla":"(Nombre del Cliente) Le escribo rápidamente para asegurarme que recibió la información. Mi compromiso es proveer la información precisa. Ya que no he recibido respuesta, puedo asumir que está ocupado o no tiene preguntas en este momento. Para aclarar algunos puntos que le ayuden a tomar su decisión, ¿prefiere que tengamos una breve llamada?"},{"stage":"En Contacto","channel":"Llamada","src":"Contact Plan CDK","brand":"Multimarca","id":"L5","t":"Reintento Telefónico (Día 3)","when":"Día 3 — 2 llamadas dobles","Momento / condición":"Lead digital CDK","Objetivo":"El cliente conoce disponibilidad y opciones como nuevo gancho de valor. Registro CRM: marcar intento y resultado del Día 3.","CTA / salida":"Agendar cita para conocer el vehículo","Guión / llamada":"Mensaje sugerido (11 Principios de Respuesta BDC): incluya fotos/video del vehículo, cree urgencia profesional, invite a la agencia hoy o mañana."},{"stage":"Nuevo / En Contacto","channel":"Vambe / WhatsApp","src":"Contact Plan CDK","brand":"Multimarca","id":"L6","t":"WhatsApp Vambe — Plantilla Influyente (Día 3)","when":"Día 3 — inmediatamente después de las llamadas sin respuesta","Momento / condición":"Lead digital CDK","Objetivo":"El cliente recibe una invitación cercana y concreta a visitar la agencia. Registro CRM: marcar envío de plantilla Influyente.","CTA / salida":"Responder el mensaje o indicar disponibilidad","Mensaje / plantilla":"Hola \"Nombre del Cliente\" Quiero aprovechar esta oportunidad para darle las “Gracias” por permitirme ayudarle en la búsqueda del (AUTO) que, además de innovador es una ¡magnífica opción! No he tenido éxito para contactarle. Me encantaría que me avise antes de su llegada a la agencia, para preparar el auto, que esté reluciente y listo para su prueba de manejo. ¿Cuándo le veo en la agencia hoy o mañana"},{"stage":"En Contacto","channel":"Llamada","src":"Contact Plan CDK","brand":"Multimarca","id":"L7","t":"Reintento Telefónico (Día 4)","when":"Día 4 — 2 llamadas dobles","Momento / condición":"Lead digital CDK","Objetivo":"El cliente percibe paciencia y disponibilidad sin presión. Registro CRM: marcar intento y resultado del Día 4.","CTA / salida":"Agendar cita o confirmar interés","Guión / llamada":"Mensaje sugerido (11 Principios de Respuesta BDC): escuche lo que el cliente solicita, realice preguntas relevantes, reafirme necesidades detectadas."},{"stage":"Nuevo / En Contacto","channel":"Vambe / WhatsApp","src":"Contact Plan CDK","brand":"Multimarca","id":"L8","t":"WhatsApp Vambe — Plantilla Estable (Día 4)","when":"Día 4 — inmediatamente después de las llamadas sin respuesta","Momento / condición":"Lead digital CDK","Objetivo":"El cliente siente seguridad y ausencia de presión, con foco en su tranquilidad. Registro CRM: marcar envío de plantilla Estable.","CTA / salida":"Responder el mensaje o indicar disponibilidad","Mensaje / plantilla":"Nombre del cliente: Existe una línea muy delgada que separa a un cliente con atención persistente y uno molesto, por la insistencia y yo no quiero cruzar esa línea por ningún motivo. Sólo quiero asegurarme que sus necesidades sean satisfechas. Este auto tiene los más altos estándares de seguridad ya que se construye para protegerle a usted y su familia. Podemos agendar un tiempo conveniente para reunirnos a platicar y pueda manejar el (AUTO). Estoy a un mensaje de usted."},{"stage":"En Contacto","channel":"Llamada","src":"Contact Plan CDK","brand":"Multimarca","id":"L9","t":"Reintento Telefónico (Día 5, último de la semana 1)","when":"Día 5 — 2 llamadas dobles","Momento / condición":"Lead digital CDK","Objetivo":"Cierre directo del primer ciclo de contacto activo. Registro CRM: marcar intento y resultado del Día 5.","CTA / salida":"Agendar cita","Guión / llamada":"Mensaje sugerido (11 Principios de Respuesta BDC): realice la 'cita' directamente — pregunte por cita presencial o virtual, hoy o mañana, con lenguaje directo."},{"stage":"Nuevo / En Contacto","channel":"Vambe / WhatsApp","src":"Contact Plan CDK","brand":"Multimarca","id":"L10","t":"WhatsApp Vambe — Plantilla Dominante (Día 5)","when":"Día 5 — inmediatamente después de las llamadas sin respuesta","Momento / condición":"Lead digital CDK","Objetivo":"El cliente recibe un mensaje corto y directo con una acción clara. Registro CRM: marcar envío de plantilla Dominante; cierra el primer bloque de 5 días.","CTA / salida":"Responder el mensaje o indicar disponibilidad","Mensaje / plantilla":"Señor(a) (Nombre del Cliente) Sabemos que lo único constante en la vida es el cambio. Me doy cuenta que con el tiempo las situaciones cambian y quizás no esté listo para tomar una decisión en este momento. Usted debería tomar todo el tiempo que necesite para continuar su investigación. Claro, espero que cuando esté listo para tomar el siguiente paso, recuerde mi servicio puntual y buena disposición para proveerle de la mejor información que le ayude con este proceso."},{"stage":"En Contacto","channel":"Llamada","src":"Contact Plan CDK","brand":"Multimarca","id":"L11","t":"Escalamiento — Llamada Gerencia de Ventas (Día 7)","when":"Día 7 — llamada de Gerencia de Ventas","Momento / condición":"ESCALAMIENTO GERENCIAL — SIN RESPUESTA (DÍA 7 A DÍA 35)","Objetivo":"El cliente percibe una segunda oportunidad de contacto con mayor jerarquía. Registro CRM: marcar llamada gerencial Día 7 y resultado (contactado / no contesta).","CTA / salida":"Agendar cita o confirmar interés","Guión / llamada":"Mensaje sugerido (no hay guión literal de CDK para esta llamada): identifíquese como Gerencia de Ventas, mencione los intentos previos de contacto, reafirme beneficios de cliente digital y pregunte si continúa interesado."},{"stage":"Nuevo / En Contacto","channel":"Vambe / WhatsApp","src":"Contact Plan CDK","brand":"Multimarca","id":"L12","t":"WhatsApp Vambe — Plantilla No Respuesta (Día 7)","when":"Día 7 — inmediatamente después de la llamada de Gerencia de Ventas sin respuesta","Momento / condición":"ESCALAMIENTO GERENCIAL — SIN RESPUESTA (DÍA 7 A DÍA 35)","Objetivo":"El cliente recibe seguimiento digital tras la llamada gerencial sin respuesta. Registro CRM: marcar envío de plantilla No Respuesta Día 7.","CTA / salida":"Responder el mensaje o indicar disponibilidad","Mensaje / plantilla":"Estimado \"Nombre del Cliente\" Sé lo importante que es tomar una decisión informada. Por favor, hágame saber si existe algún dato adicional que pueda ser útil en su proceso de compra. Le menciono los beneficios que recibirá al ser un cliente por Internet: 1) Trámite digital, no es necesario salir de casa. 2) Prueba de manejo a domicilio. Nos preocupan mucho nuestros clientes digitales y queremos mbe — Plantilla No Respuesta (Día 14)","when":"Día 14","Momento / condición":"ESCALAMIENTO GERENCIAL — SIN RESPUESTA (DÍA 7 A DÍA 35)","Objetivo":"El cliente recibe una pregunta directa sobre su objeción principal. Registro CRM: marcar envío de plantilla Día 14.","CTA / salida":"Responder el mensaje indicando su principal objeción o interés","Mensaje / plantilla":"Estimado \"Nombre del Cliente\" Han pasado un par de semanas desde que usted expresó su interés en mí (Modelo). Sé que hay que realizar muchas consideraciones antes de tomar una decisión. Por lo cual quiero reafirmar mi compromiso de brindarle un servicio personalizado e información útil. Siéntase en libertad para decidir cuál es el tiempo necesario para finalizar este proceso y no se preocupe, yo estaré siempre disponible. ¿Qué puedo hacer para ayudarle y hacer de está, una experiencia única y satisfactoria?"},{"stage":"En Contacto","channel":"Vambe / WhatsApp","src":"Contact Plan CDK","brand":"Multimarca","id":"L16","t":"WhatsApp Vambe — Plantilla No Respuesta, firma Gerente de Ventas (Día 21)","when":"Día 21","Momento / condición":"ESCALAMIENTO GERENCIAL — SIN RESPUESTA (DÍA 7 A DÍA 35)","Objetivo":"El cliente percibe una segunda escalación de jerarquía junto con preguntas de diagnóstico. Registro CRM: marcar envío de plantilla Día 21 (GV).","CTA / salida":"Responder indicando en qué etapa del proceso se encuentra","Mensaje / plantilla":"Estimado \"Nombre del Cliente\": Al hablar con mi asesor __________, entiendo que ha expresado su interés en el (Modelo). Le escribo para agradecer la oportunidad de ayudarle. Me gustaría acompañarlo en esta experiencia de compra y saber, ¿en qué parte del proceso de compra se encuentra?, si apenas está empezando a considerar algunas opciones o está listo para tomar una decisión… Permítame preguntarle: ¿Si hubo alguna única razón por la cual ustedes no han dado el paso siguiente, cuál es esa única razón?"},{"stage":"En Contacto","channel":"Vambe / WhatsApp","src":"Contact Plan CDK","brand":"Multimarca","id":"L17","t":"WhatsApp Vambe — Plantilla No Respuesta (Día 28)","when":"Día 28","Momento / condición":"ESCALAMIENTO GERENCIAL — SIN RESPUESTA (DÍA 7 A DÍA 35)","Objetivo":"El cliente recibe empatía por el proceso de decisión y una oferta de guía sin presión, incluso si compra en otro lugar. Registro CRM: marcar envío de plantilla Día 28.","CTA / salida":"Responder indicando si sigue interesado o si ya tomó una decisión","Mensaje / plantilla":"EStimado, \"Nombre del cliente\" Entiendo que la compra de un auto puede ser difícil incluso hasta frustrante, ya que hay muchos pasos que dar y considerar. Si está realizando una investigación más profunda acerca de su compra, lo felicito. Esa es la manera correcta de hacer las cosas, la compra de un auto siempre tiene que ser sabia y concienzuda. Han pasado varias semanas desde su solicitud inicial y quiero decirle que estoy disponible para ayudarle a encontrar la selección perfecta. Dígame, ¿Qué puedo hacer por usted en este momento?"},{"stage":"En Contacto","channel":"Vambe / WhatsApp","src":"Contact Plan CDK","brand":"Multimarca","id":"L18","t":"WhatsApp Vambe — Plantilla No Respuesta, último intento (Día 35)","when":"Día 35","Momento / condición":"ESCALAMIENTO GERENCIAL — SIN RESPUESTA (DÍA 7 A DÍA 35)","Objetivo":"Cierre del ciclo con puerta abierta; el cliente sabe que puede escribir cuando quiera. Registro CRM: marcar envío de plantilla Día 35 (último intento).","CTA / salida":"Responder indicando mejor forma y horario de contacto","Mensaje / plantilla":"Estimado \"Nombre del Cliente\", Es posible que usted ya tomó la decisión de comprar o no comprar. Sea cual sea, quiero asegurarme de que todo lo que solicitó fue completado y le dimos el mejor de nuestros servicios. Esta es una decisión importante y debe estar seguro de que aquí hay un profesional para apoyarle. Puedo asegurarle que soy la persona correcta para este tipo de situaciones incluso si está pensando en comprar en otro lugar, le puedo guiar. ¿Cuál es la mejor manera de localizarlo durante el día?"},{"stage":"Nuevo / En Contacto","channel":"Administrativo","src":"Contact Plan CDK","brand":"Multimarca","id":"L19","t":"Descarte de Lead (fin del ciclo de 35 días)","when":"Día 35 — si no hubo respuesta a ningún toque","Momento / condición":"ESCALAMIENTO GERENCIAL — SIN RESPUESTA (DÍA 7 A DÍA 35)","Objetivo":"Cerrar formalmente el ciclo de contacto en CRM. Registro CRM: cambiar estatus del lead a Descartado/Retenido; el lead sale de este journey.","CTA / salida":"Ninguna (toque de cierre administrativo)"},{"stage":"En Contacto","channel":"Vambe / WhatsApp","src":"Contact Plan CDK","brand":"Multimarca","id":"L20","t":"Envío de Diferenciadores de Marca y Tarjeta Digital en Formato Imagen (al establecer contacto)","when":"Inmediato al lograr contacto efectivo, en cualquier día del ciclo (Día 1 a 35)","Momento / condición":"CONTACTO ESTABLECIDO Y AGENDAMIENTO (en cualquier día del ciclo)","Objetivo":"El cliente conoce la persona que lo está atendiendo + los diferenciadores de marca desde el primer contacto real. Registro CRM: marcar 'Diferenciadores de marca y tarjeta digital enviados' en el lead.","CTA / salida":"Ninguna (toque informativo)","Mensaje / plantilla":"Hola [nombre del cliente]. ¡Qué gusto saludarte!🤝 Soy Daniel Hernández, asesor de la agencia de KIA Bajío.🚗 Recibí tu solicitud de información de nuestros vehículos KIA. ¿Te gustaría continuar por mensaje o prefieres que te realice una llamada?","Guión / llamada":"Mensaje sugerido (11 Principios de Respuesta BDC): mencione los diferenciadores de memoria o envíe la imagen; deben ser los diferenciadores específicos que pide cada marca."},{"stage":"Cita Programada","channel":"Vambe / WhatsApp","src":"Contact Plan CDK","brand":"Multimarca","id":"C2","t":"Confirmación Inmediata de Cita — Vambe + e-mail","when":"Inmediato al generar la cita","Momento / condición":"FLUJO DE CITA Y CONFIRMACIÓN (Los recordatorios ya están automatizados en Vambe)","Objetivo":"El cliente confirma que su cita quedó registrada correctamente. Registro CRM: marcar 'Confirmación enviada' en la cita.","CTA / salida":"Confirmar recepción o reprogramar si hay algún inconveniente","Mensaje / plantilla":"Mensaje sugerido (no hay plantilla literal de CDK; estructura base de confirmación de cita): Hola {{nombre}}, {{asesor}}, de {{agencia}}, le confirma su cita para conocer el {{modelo}}: 📅 {{fecha_cita}} a las {{hora_cita}}, 📍 {{agencia}} - {{direccion_agencia}}. ¿Alguna duda? Responda aquí."},{"stage":"Cita Programada","channel":"Vambe / WhatsApp","src":"Contact Plan CDK","brand":"Multimarca","id":"C3","t":"Recordatorio D-1 — Vambe","when":"Día previo a la cita","Momento / condición":"FLUJO DE CITA Y CONFIRMACIÓN (Los recordatorios ya están automatizados en Vambe)","Objetivo":"El cliente recuerda su cita y confirma asistencia. Registro CRM: marcar 'Recordatorio D-1 enviado'.","CTA / salida":"Confirmar asistencia respondiendo 'SÍ'","Mensaje / plantilla":"“Tu próximo coche te espera” Hola {nombre_cliente}, buen día. Mañana puede ser el día en que conozcas tu próximo coche. Te esperamos en {agencia} a las {hora_cita} para presentarte el {vehiculo_interes}; {nombre_asesor} estará listo para acompañarte, resolver tus dudas y mostrarte los detalles que hacen la diferencia. Ubicación: {link_ubicacion} Nos dará gusto recibirte. 🚗 Botones: Confirmo asistencia Deseo reagendar Respuesta automática, Confirmo asistencia: ¡Gracias por confirmar, {nombre_cliente}! Mañana te esperamos en {agencia} para conocer el {vehiculo_interes}. Llega 10 min antes para que podamos recibirte con calma y aprovechar mejor tu visita. Respuesta automática, Deseo reagendar: Entendido, {nombre_cliente}. Indicame dia y hora en que deseas asistir."},{"stage":"Cita Programada","channel":"Vambe / WhatsApp","src":"Contact Plan CDK","brand":"Multimarca","id":"C4","t":"Recordatorio Mismo Día (4–2 hrs antes) — Vambe","when":"Mismo día de la cita, entre 4 y 2 horas antes"," an CDK","brand":"Multimarca","id":"NS2","t":"No Show — WhatsApp Vambe (si no contesta la llamada)","when":"Inmediatamente después de la llamada de No Show sin respuesta","Momento / condición":"NO SHOW","Objetivo":"El cliente recibe una invitación empática a reagendar, sin tono acusatorio. Registro CRM: marcar envío de mensaje de No Show.","CTA / salida":"Reagendar para hoy o mañana, o compartir el motivo de la inasistencia","Mensaje / plantilla":"Hola. ¡Es un gusto saludarle! Mi nombre es {{asesor}}, líder de {{agencia}}. Para nosotros es muy importante brindarle una atención de calidad y acompañarle durante todo su proceso de búsqueda de vehículo. Intenté comunicarme con usted en varias ocasiones, ya que el día de ayer teníamos programada una cita en nuestra agencia, pero no tuvimos el gusto de recibir su visita. Entendemos que pueden surgir imprevistos o cambios de planes. Por ello, me gustaría saber si continúa interesado(a) en conocer nuestros vehículos o si prefiere que le apoyemos en una fecha y horario más convenientes para usted. De igual manera, si considera que la cita no era adecuada para sus necesidades, agradeceremos mucho que nos lo comparta para poder mejorar nuestra atención. ¿Le gustaría reagendar su visita para el día de hoy o para mañana?"},{"stage":"Cita Programada","channel":"Administrativo","src":"Contact Plan CDK","brand":"Multimarca","id":"P1","t":"Entra a Journey de Piso (CDK)","when":"Al momento de asistir a la cita en agencia","Momento / condición":"SALIDA DEL JOURNEY","Objetivo":"El lead pasa de responsabilidad BDC a responsabilidad de Piso. Registro CRM: cambiar etapa del lead de 'Contacto' a 'Oportunidad en Piso'; este journey termina aquí.","CTA / salida":"N/A"},{"stage":"En Recepción","channel":"Presencial","src":"Touch Points Piso","brand":"Multimarca","id":"P1","t":"Bienvenida y Recepción en Piso","when":"Llegada del cliente a la agencia","Momento / condición":"RECEPCIÓN Y REGISTRO EN PISO","Objetivo":"Llegada del cliente a la agenc     dispatched_at: o.dispFail === crm ? null : lead.created + 40000, last_error: o.dispFail === crm ? 'timeout' : null,
  }));
  lead.activity.push({ ts: lead.created, who: 'Middleware', txt: `Lead recibido vía <b>${esc(lead.source)}</b> · formulario “${esc(lead.form_name)}” → intent <b>${lead.intent}</b>` });
  return lead;
}

/* ============================================================================
   D. MOTOR DEL JOURNEY — siguiente mejor acción por lead
   ============================================================================ */
/** Toques que aplican a una etapa (excluye reglas Creatio, que se muestran como automatizaciones). */
function stageTouches(stage) {
  return DATA.touches.filter(t => stage.touchStages.includes(t.stage) && t.src !== 'Creatio actual');
}
function tvTouches(tv) { return DATA.touches.filter(t => tv.touchStages.includes(t.stage)); }

/** Calcula la siguiente acción del lead según su etapa:
 *  - Nuevo/En Contacto sin contacto efectivo → cadencia L1…L19 (35 días)
 *  - Contacto efectivo → L20 (diferenciadores) y agendar cita
 *  - Resto de etapas → primer toque pendiente de la etapa (Touch Points Piso)
 *  Devuelve {touch, owner, due:'vencido'|'hoy'|'próximo', label} o null. */
function nextAction(l) {
  if (l.status === 'descartado') return null;
  const st = STAGES[l.stage];
  if (l.stage <= 1 && l.cadenceOutcome !== 'contactado') {
    const c = CADENCE[l.cadenceIdx];
    if (!c) return null;
    const owner = ['L11','L13'].includes(c.id) ? 'Gerencia' : 'BDC';    // escalamientos gerenciales Día 7 y 10
    const due = c.day < l.day ? 'vencido' : c.day === l.day ? 'hoy' : 'próximo';
    return { touch: c.touch, owner, due, label: `Día ${c.day} de 35` };
  }
  if (l.stage <= 1 && l.cadenceOutcome === 'contactado') {
    const l20 = DATA.touches.find(t => t.id === 'L20');
    if (!l.done.has(l20.key)) return { touch: l20, owner:'BDC', due:'hoy', label:'Contacto efectivo' };
    return { touch: null, owner:'BDC', due:'hoy', label:'Agendar cita', custom:'agendar' };
  }
  if (st.key === 'cita' && l.appt && l.appt.status === 'no_show') {
    const ns = DATA.touches.filter(t => t.id.startsWith('NS')).find(t => !l.done.has(t.key));
    if (ns) return { touch: ns, owner:'BDC', due:'vencido', label:'No show' };
  }
  if (st.key === 'cita') {
    const t = stageTouches(st).filter(t => !t.id.startsWith('NS') && t.id !== 'P1').find(t => !l.done.has(t.key));
    if (t) return { touch: t, owner:'BDC', due: 'hoy', label: 'Confirmación de cita' };
    return { touch: null, owner:'Hostess', due:'hoy', label:'Esperando llegada', custom:'checkin' };
  }
  if (st.key === 'atendido') {
    // En "Atendido" el journey propone prueba de manejo como siguiente paso natural
    const t = tvTouches(TRANSVERSALS[1]).find(t => !l.done.has(t.key));
    if (t) return { touch: t, owner:'APV', due:'hoy', label:'Prueba de manejo (transversal)' };
    return { touch: null, owner:'APV', due:'hoy', label:'Generar cotización', custom:'avanzar' };
  }
  const t = stageTouches(st).find(t => !l.done.has(t.key));
  if (t) return { touch: t, owner: st.owner, due: 'hoy', label: st.name };
  return { touch: null, owner: st.owner, due:'próximo', label:'Etapa completa', custom:'avanzar' };
}

/** ¿Este rol trabaja esta acción? Gerencia ve todo. */
const roleOwns = (owner, role) => role === 'Gerencia' || owner === role || (role === 'APV' && owner === 'F&I');

/** Campos de una etapa (columna de matriz) o de un módulo transversal. */
function fieldsFor(scope) {
  if (scope.mod) return DATA.fields.filter(f => f.m === scope.mod);
  return DATA.fields.filter(f => f.s[scope.col]);
}
/** Roles de un campo en un alcance (si es módulo transversal sin etapa → todos). */
function fieldRoles(f, scope) {
  if (scope.mod) { const all = Object.values(f.s).flat(); return all.length ? [...new Set(all)] : ['Sin etapa']; }
  return f.s[scope.col] || [];
}
const canEdit = (roles, role) => role === 'Gerencia' || roles.some(r => r === role || (role === 'APV' && r === 'F&I') || r === 'Sin etapa');

/** % de captura de la etapa actual para el rol activo. */
function completion(l, scope = { col: STAGES[l.stage].col }) {
  const fs = fieldsFor(scope).filter(f => canEdit(fieldRoles(f, scope).filter(r => !r.includes('lectura')), state.role) && !/^F1(1[1-8])$/.test(f.id));
  if (!fs.length) return { pct: null, done: 0, total: 0 };   // null = no aplica a este rol
  const done = fs.filter(f => l.fields[f.id] !== undefined && l.fields[f.id] !== '' && l.fields[f.id] !== false).length;
  return { pct: Math.round(done / fs.length * 100), done, total: fs.length };
}

/* ============================================================================
   E. SIMULADOR DEL MIDDLEWARE (lead-capture-middleware) — sin red real
   ----------------------------------------------------------------------------
   Reproduce el comportamiento documentado en leads-api.md:
   - POST /webhooks/at_plus (propuesta opción B) → 201 {status:"ok", lead_id}
     o 200 {status:"ignored"} si no hay email ni teléfono
   - DispatchLeadJob asíncrono → crm_dispatches pending → success/failed
   - POST /api/v1/vambe_messages → 202 + relay (queued → sent)
   - POST /api/v1/appointments → confirmation_code; POST …/check_in
   - POST /api/v1/cotizations/external → precio REFERENCIAL de toma
   ============================================================================ */
const MW = {
  /** Construye el payload que AT+ enviaría al middleware (alias preferidos del contrato). */
  payload(f) {
    return {
      source: f.source, source_id: f.external_id, form_name: f.form_name,
      name: f.first, last_name: f.last, email: f.email || undefined, phone: normPhone(f.phone) || undefined,
      make: f.brand, model: f.model, year: f.year, version: f.version || undefined,
      agency: AGENCIES[f.brand], domain: 'at-plus.autocom.example',
      utm_source: f.utm_source || undefined, customer_need: f.need || undefined,
    };
  },
  /** Crea el lead. Regla de negocio: sin phone ni email → "ignored" (se trata como error). */
  createLead(f) {
    const p = this.payload(f);
    if (!p.phone && !p.email) return { http: 200, body: { status: 'ignored' } };
    // Dedupe: UniqueContactFinder (match exacto por email O teléfono)
    const match = state.leads.find(l => (p.email && l.email === p.email) || (p.phone && l.phone === p.phone));
    const lead = mkLead({ first: f.first, last: f.last, email: p.email || '', phone: p.phone || '', brand: f.brand, model: f.model, year: f.year, version: f.version, source: f.source, form: f.form_name, mins: 0, ucid: match?.unique_contact_id, temp: 'Tibio', stage: f.stage ?? 0, asesor: f.asesor, cat: f.category, bdc: f.source === 'at_plus_piso' ? '—' : undefined });
    lead.dispatches.forEach(d => Object.assign(d, { status: 'pending', external_id: null, dispatched_at: null, attempts: 0 }));
    lead.raw_payload = p;
    state.leads.unshift(lead);
    this.dispatch(lead);
    return { http: 201, body: { status: 'ok', lead_id: lead.id }, lead, match };
  },
  /** DispatchLeadJob: resuelve cada CRM de forma asíncrona (simulado 1.5–3 s). */
  dispatch(lead, only) {
    lead.dispatches.filter(d => !only || d.crm === only).forEach((d, i) => {
      d.status = 'pending';
      setTimeout(() => {
        d.status = 'success'; d.attempts++; d.last_error = null; d.dispatched_at = Date.now();
        d.external_id = d.crm === 'dynamics' ? uuid() : 'vb_' + Math.random().toString(36).slice(2, 10);
        lead.activity.unshift({ ts: Date.now(), who: 'Middleware', txt: `crm_dispatch <b>${d.crm}</b> → success (${d.external_id.slice(0, 13)}…)` });
        rerenderIf(lead);
      }, 1500 + i * 1200);
    });
  },
  /** Vambe: 202 Accepted + relay; el estado se conoce después (polling). */
  sendVambe(lead, touch) {
    const relay = { id: uuid(), template: touch ? `${touch.id} · ${touch.t}` : 'Mensaje libre', status: 'queued', at: Date.now() };
    lead.relays.unshift(relay);
    setTimeout(() => { relay.status = 'sent'; rerenderIf(lead); }, 1800);
    return { http: 202, relay };
  },
  /** Citas: devuelve confirmation_code para check-in en recepción. */
  createAppointment(lead, at, kind) {
    const code = (kind === 'Entrega' ? 'ENT-' : 'CITA-') + Math.random().toString(36).slice(2, 6).toUpperCase();
    lead.appt = { code, at, status: 'scheduled', kind };
    return { http: 201, confirmation_code: code };
  },
  checkIn(lead, by) { lead.appt.status = 'checked_in'; lead.appt.checked_in_by = by; return { http: 200 }; },
  /** Cotización de toma (auto a cuenta): SIEMPRE referencial. */
  quoteTradeIn(f) {
    const base = { '2024': 360000, '2023': 320000, '2022': 285000, '2021': 250000, '2020': 220000 }[f.year] || 180000;
    const km = Number(f.km || 0);
    return { http: 201, min: Math.round((base - km * 0.6) * 0.88 / 1000) * 1000, max: Math.round((base - km * 0.6) / 1000) * 1000 };
  },
};
function rerenderIf(lead) { if (state.view === 'lead' && state.leadId === lead.id) render(); else if (['integraciones','leads','home'].includes(state.view)) render(); }

   ============================================================================ */
/** Cola: leads cuya siguiente acción le toca al rol activo, ordenada por urgencia y SLA. */
function queue() {
  const rank = { vencido: 0, hoy: 1, 'próximo': 2 };
  return state.leads.map(l => ({ l, a: nextAction(l) }))
    .filter(x => x.a && roleOwns(x.a.owner, state.role))
    .filter(x => state.role !== 'APV' || !x.l.asesor || x.l.asesor === ROLES.find(r => r.key === 'APV').user || x.l.stage < 4)
    .sort((x, y) => rank[x.a.due] - rank[y.a.due] || x.l.created - y.l.created);
}

function slaChip(l) {
  // SLA del journey: primer contacto dentro de los primeros 10 minutos (L1 / F069)
  if (l.stage !== 0 || l.cadenceIdx > 0) return '';
  const m = Math.floor((Date.now() - l.created) / 60000);
  const left = 10 - m;
  return left > 0 ? `<span class="chip warn">${icon('clock','sm')}<span class="sla">${left} min</span> para SLA</span>` : `<span class="chip err">${icon('alert','sm')}SLA vencido +${-left} min</span>`;
}

const sel = (name, opts, val, label) => `<select class="input" data-filter="${name}"><option value="">${label}</option>${opts.map(([v, t]) => `<option value="${esc(v)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
const dispDots = l => `<span style="display:inline-flex;gap:6px;align-items:center">${l.dispatches.map(d => `<span title="${d.crm}: ${d.status}" style="display:inline-flex;gap:3px;align-items:center" class="small"><i class="dot ${d.status}"></i>${d.crm.slice(0, 3)}</span>`).join('')}</span>`;

/* ============================================================================
   J. VISTA: FICHA 360 DEL LEAD
   ============================================================================ */
function viewLead() {
  const l = state.leads.find(x => x.id === state.leadId);
  if (!l) return '<div class="empty">Lead no encontrado</div>';
  const st = STAGES[l.stage], comp = completion(l);
  const siblings = state.leads.filter(x => x.unique_contact_id === l.unique_contact_id && x.id !== l.id);
  const tabs = [
    ['accion', 'Siguiente acción'], ['captura', `Captura <span class="badge">${comp.pct === null ? '—' : comp.pct + '%'}</span>`], ['cadencia', 'Toques del journey'],
    ['expediente', `Expediente <span class="badge">${l.docs.size}/41</span>`], ['actividad', 'Actividad'], ['integraciones', 'Integraciones'],
  ];
  return `
  <div><button class="btn ghost sm" data-action="go" data-view="leads">${icon('back','sm')}Leads</button></div>
  <section class="card">
    <div class="lead-head">
      <div class="avatar big">${initials(l)}</div>
      <div><h1>${esc(fullName(l))} ${l.status === 'descartado' ? '<span class="chip err">Descartado</span>' : ''}</h1>
        <div class="small muted" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:2px">
          <span>${icon('car','sm')} ${esc(l.brand)} ${esc(l.model)} ${esc(l.year)}</span><span>· ${esc(l.agency)}</span><span>· Fuente <b>${esc(l.source)}</b></span><span>· Intent <b>${l.intent}</b></span>
          <span class="temp ${l.temp}">· ${icon('flame','sm')}${l.temp}</span></div></div>
      <div class="acts">
        <button class="btn ghost" data-action="log-call" data-id="${l.id}">${icon('phone')}Llamar</button>
        <button class="btn ghost" data-action="wa-free" data-id="${l.id}">${icon('chat')}WhatsApp</button>
        <button class="btn secondary" data-action="appt" data-id="${l.id}">${icon('cal')}Agendar cita</button>
        ${l.stage < STAGES.length - 1 && l.status !== 'descartado' ? `<button class="btn" data-action="advance" data-id="${l.id}">Avanzar a ${STAGES[l.stage + 1].name}${icon('arrow')}</button>` : ''}
      </div>
    </div>
    <div class="stepper">${STAGES.map((s, i) => `<div class="step ${i < l.stage ? 'done' : i === l.stage ? 'cur' : ''}" data-action="jump" data-id="${l.id}" data-stage="${i}" title="Mover a ${s.name}"><i></i>${s.name}<small>${s.obj}</small></div>`).join('')}</div>
    <div class="tv-row"><span class="small muted" style="font-weight:600">Transversales:</span>
      ${TRANSVERSALS.map(t => `<button class="tv ${l.tv[t.key] === 'ok' ? 'ok' : l.tv[t.key] ? 'on' : ''}" data-action="tv" data-id="${l.id}" data-tv="${t.key}" title="${t.window} · clic para cambiar estado">${l.tv[t.key] === 'ok' ? icon('check','sm') : ''}${t.name}<span class="small">${l.tv[t.key] === 'ok' ? 'completo' : l.tv[t.key] ? 'en curso' : ''}</span></button>`).join('')}
    </div>
  </section>
  <div class="lead-grid">
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <div class="tabs">${tabs.map(([k, t]) => `<button class="${state.leadTab === k ? 'active' : ''}" data-action="tab" data-tab="${k}">${t}</button>`).join('')}</div>
      ${{ accion: tabAccion, captura: tabCaptura, cadencia: tabCadencia, expediente: tabExpediente, actividad: tabActividad, integraciones: tabIntegraciones }[state.leadTab](l)}
    </div>
    <aside style="display:flex;flex-direction:column;gap:16px">
      <section class="card"><div class="card-h"><h3>Resumen</h3><span class="chip dark">${esc(st.obj)}</span></div><div class="card-b">
        <dl class="kv">
          <dt>Teléfono</dt><dd>${esc(l.phone) || '—'}</dd><dt>Correo</dt><dd>${esc(l.email) || '—'}</dd>
          <dt>Asesor BDC</dt><dd>${esc(l.bdc)}</dd><dt>Asesor piso</dt><dd>${esc(l.asesor) || '<span class="muted">Sin asignar</span>'}</dd>
          <dt>Categoría CDK</dt><dd>${esc(l.category)}</dd>
          <dt>Cita</dt><dd>${l.appt ? `${esc(l.appt.code)} · ${fmtDate(l.appt.at)} <span class="chip ${l.appt.status === 'no_show' ? 'err' : l.appt.status === 'checked_in' ? 'ok' : 'info'}">${{ scheduled:'Agendada', checked_in:'Llegó', no_show:'No asistió' }[l.appt.status]}</span>` : '—'}</dd>
          <dt>Ciclo</dt><dd>${l.stage <= 1 ? `Día ${l.day} de 35` : '—'}</dd>
        </dl></div></section>
      <section class="card"><div class="card-h"><h3>Captura de la etapa</h3><span class="small muted">${comp.done}/${comp.total} campos de ${state.role}</span></div>

        <p class="small muted" style="margin:8px 0 0">El avance de etapa no se bloquea, pero se avisa si faltan campos (regla a validar con negocio).</p></div></section>
      <section class="card"><div class="card-h"><h3>Mismo contacto</h3><span class="chip">${siblings.length + 1} leads</span></div><div class="card-b small">
        ${siblings.length ? siblings.map(s => `<div style="display:flex;justify-content:space-between;padding:4px 0;cursor:pointer" data-action="open" data-id="${s.id}"><span>${esc(s.brand)} ${esc(s.model)} · ${esc(s.source)}</span><span class="muted">${s.status === 'descartado' ? 'Descartado' : STAGES[s.stage].name}</span></div>`).join('') : '<span class="muted">Sin otros leads de esta persona.</span>'}
        <p class="muted" style="margin:8px 0 0">Agrupado por <span class="mono">unique_contact_id</span> (match exacto email o teléfono).</p></div></section>

/** Reemplaza variables de las plantillas del journey con datos del lead. */
function fillTemplate(txt, l) {
  const asesor = l.asesor || l.bdc;
  return String(txt || '')
    .replace(/\(Primer nombre del cliente\)|\(Nombre del Cliente\)|"Nombre del Cliente"|“Nombre del Cliente”|"Nombre del cliente"|\{\{nombre\}\}|\{nombre_cliente\}|\[nombre del cliente\]|Nombre del cliente:/gi, l.first)
    .replace(/\{\{asesor\}\}|\{nombre_asesor\}/g, asesor).replace(/\{\{agencia\}\}|\{agencia\}/g, l.agency)
    .replace(/\(Modelo\)|\{\{modelo\}\}|\{vehiculo_interes\}|\(AUTO\)/g, `${l.brand} ${l.model}`)
    .replace(/\{\{fecha_cita\}\}/g, l.appt ? new Date(l.appt.at).toLocaleDateString('es-MX') : '—')
    .replace(/\{\{hora_cita\}\}|\{hora_cita\}/g, l.appt ? new Date(l.appt.at).toLocaleTimeString('es-MX', { hour:'2-digit', minute:'2-digit' }) : '—');
}

/** Pestaña "Siguiente acción": el toque que toca hacer AHORA, con guion/plantilla y botones de resultado. */
function tabAccion(l) {
  const a = nextAction(l);
  if (!a) return `<div class="alert info">${icon('flag')}<div>Este lead salió del journey activo (${l.status || 'cerrado'}). Si el cliente vuelve a escribir, se crea un nuevo lead ligado al mismo contacto.</div></div>`;
  const t = a.touch;
  const isCall = t && t.channel === 'Llamada', isWa = t && (t.channel === 'Vambe / WhatsApp' || t.channel === 'Twilio');
  const msg = t && (t['Mensaje / plantilla'] || t['Guión / llamada']);
  let actions = '';
  if (t && t.id === 'L19') actions = `<button class="btn dark" data-action="discard" data-id="${l.id}">${icon('x')}Descartar lead (fin de ciclo)</button>`;
  else if (isCall) actions = `
      <button class="btn success" data-action="outcome" data-out="contactado" data-id="${l.id}">${icon('check')}Contactado</button>
      <button class="btn ghost" data-action="outcome" data-out="no_contesta" data-id="${l.id}">${icon('phone')}No contesta</button>
      <button class="btn ghost" data-action="outcome" data-out="equivocado" data-id="${l.id}">Número equivocado</button>`;
  else if (isWa) actions = `<button class="btn" data-action="send-wa" data-id="${l.id}" data-touch="${t.key}">${icon('send')}Enviar por Vambe</button><button class="btn ghost" data-action="done" data-id="${l.id}" data-touch="${t.key}">Marcar como hecho</button>`;
  else if (t) actions = `<button class="btn" data-action="done" data-id="${l.id}" data-touch="${t.key}">${icon('check')}Marcar como realizado</button>`;
  else if (a.custom === 'agendar') actions = `<button class="btn" data-action="appt" data-id="${l.id}">${icon('cal')}Agendar cita</button>`;
  else if (a.custom === 'checkin') actions = `<button class="btn" data-action="checkin" data-id="${l.id}">${icon('door')}Registrar llegada (check-in)</button>`;
  else if (a.custom === 'avanzar' && l.stage < STAGES.length - 1) actions = `<button class="btn" data-action="advance" data-id="${l.id}">Avanzar a ${STAGES[l.stage + 1].name}${icon('arrow')}</button>`;
  const relays = l.relays.slice(0, 3);
  return `
  <div class="nba">
    <div class="nba-h"><span>SIGUIENTE MEJOR ACCIÓN · ${esc(a.label)} · responsable <b>${esc(a.owner)}</b></span><span class="chip ${a.due === 'vencido' ? 'err' : 'red'}">${a.due}</span></div>
    <div class="nba-b">
      ${t ? `<div style="display:flex;gap:12px;align-items:center">${chIco(t.channel)}<div><h2>${esc(t.id)} · ${esc(t.t)}</h2><div class="small muted">${esc(t.channel)} · ${esc(t.when)}</div></div></div>
      ${t['Objetivo'] ? `<div class="small"><b>Objetivo:</b> ${esc(t['Objetivo'])}</div>` : ''}
      ${msg ? `<div><div class="section-t" style="margin-bottom:6px">${t['Mensaje / plantilla'] ? 'Plantilla (variables ya reemplazadas)' : 'Guion sugerido'}</div><div class="script">${esc(fillTemplate(msg, l))}</div></div>` : ''}
      ${t['CTA / salida'] ? `<div class="small"><b>Salida esperada:</b> ${esc(t['CTA / salida'])}</div>` : ''}`
      : `<h2>${esc(a.label)}</h2><p class="muted" style="margin:0">${a.custom === 'agendar' ? 'Ya hubo contacto efectivo y se enviaron diferenciadores. Siguiente paso: cita presencial o videollamada hoy o mañana.' : a.custom === 'checkin' ? 'La hostess registra la llegada con el folio de cita.' : 'No hay toques pendientes en esta etapa.'}</p>`}
      <div style="display:flex;gap:8px;flex-wrap:wrap">${actions}</div>
      ${slaChip(l) ? `<div>${slaChip(l)} <span class="small muted">Se registra automáticamente en F069 “Se contactó antes de 10 min”.</span></div>` : ''}
    </div>
  </div>
  ${relays.length ? `<section class="card"><div class="card-h"><h3>Mensajes Vambe</h3><span class="small muted">POST /api/v1/vambe_messages → 202 + relay</span></div><div class="card-b small">
    ${relays.map(r => `<div style="display:flex;justify-content:space-between;padding:4px 0"><span>${esc(r.template)}</span><span class="chip ${r.status === 'sent' ? 'ok' : 'warn'}">${r.status}</span></div>`).join('')}</div></section>` : ''}
  ${l.stage === 3 ? `<section class="card"><div class="card-h"><h3>Asignar asesor de piso</h3></div><div class="card-b" style="display:flex;gap:8px;flex-wrap:wrap">
    ${FLOOR_AGENTS.map((a, i) => `<button class="btn ${i === 0 ? 'secondary' : 'ghost'} sm" data-action="assign" data-id="${l.id}" data-asesor="${a}">${esc(a)} ${i === 0 ? '· siguiente en turno' : ''}</button>`).join('')}</div></section>` : ''}`;
}

/** Tipo de control según el nombre del campo del journey (heurística para la maqueta). */
function control(f, l, ro) {
  const v = l.fields[f.id] ?? '', n = f.n.toLowerCase(), dis = ro ? 'disabled' : '';
  const data = `data-field="${f.id}" data-id="${l.id}"`;
  const opts = { 'temperatura':['Caliente','Tibio','Frío'], 'tipo de compra':['Contado','Financiamiento','Arrendamiento','Flotilla'], 'categoria':['Cita','Be Back','Fresh Up'],
    'mejor medio':['Llamada','WhatsApp','Correo'], 'segunda mejor':['Llamada','WhatsApp','Correo'], 'modalidad':['Agencia','A domicilio'], 'estado':['Programada','Realizada','Cancelada'],
    'tipo de financiamiento':['Banco','Financiera de marca','Autofinanciamiento'], 'divisa':['MXN','USD'], 'carroceria':['SUV','Sedán','Hatchback','Pick-up','Minivan'], 'transmisión':['Automática','Manual'] };
  const key = Object.keys(opts).find(k => n.startsWith(k));
  if (key) return `<select class="input" ${data} ${dis}><option value="">Selecciona…</option>${opts[key].map(o => `<option ${v === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
  if (/^(¿|se |es |al saludar|envía|envío|mención|ofrecer|flotilla|pago de anticipo|enganche$)/.test(n) || n.includes('?'))
    return `<div class="toggle" role="group">${['Sí','No'].map(o => `<button type="button" class="${v === o ? 'on' : ''}" data-action="yn" ${data} data-val="${o}" ${dis}>${o}</button>`).join('')}</div>`;
  if (/fecha|hora/.test(n)) return `<input type="datetime-local" class="input" ${data} value="${esc(v)}" ${dis}>`;
  if (/comentario|notas|notes/.test(n)) return `<textarea class="input" ${data} rows="2" ${dis}>${esc(v)}</textarea>`;
  if (/precio|importe|monto|presupuesto|ingresos|pago inicial|mensualidades|descuento|kilometraje|cantidad/.test(n)) return `<input type="number" class="input" ${data} value="${esc(v)}" placeholder="0" ${dis}>`;
  return `<input class="input" ${data} value="${esc(v)}" ${dis}>`;
}

/** Pestaña "Captura": formulario dinámico construido con la matriz campo × etapa × rol del journey. */
function tabCaptura(l) {
  const st = STAGES[l.stage];
  const scopes = [{ key:'stage', name:`Etapa: ${st.name}`, col: st.col }, ...TRANSVERSALS.filter(t => t.col !== undefined || t.mod).filter(t => t.key !== 'exp')];
  const scope = scopes.find(s => s.key === state.captureScope) || scopes[0];
  let fs = fieldsFor(scope);
  const all = fs.length;
  if (!state.showAllFields) fs = fs.filter(f => canEdit(fieldRoles(f, scope), state.role) || fieldRoles(f, scope).some(r => r.startsWith(state.role)));
  const byMod = {};
  fs.forEach(f => (byMod[f.m] = byMod[f.m] || []).push(f));
  const c = completion(l, scope);
  return `
  <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
    <div class="seg">${scopes.map(s => `<button class="${s.key === scope.key ? 'on' : ''} ${s.key !== 'stage' ? 'tvb' : ''}" data-action="scope" data-scope="${s.key}">${esc(s.name)}</button>`).join('')}</div>
    <label class="small" style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" data-action="allfields" ${state.showAllFields ? 'checked' : ''}> Ver campos de otros roles (${all})</label>
  </div>
  <div class="alert info">${icon('list')}<div><b>${fs.length} campos</b> para <b>${state.role}</b> en ${esc(scope.name)} · ${c.done}/${c.total} capturados. Los campos y roles salen directo de la matriz del journey (F001–F199). Los grises son de lectura u otro rol.</div></div>
  ${scope.key === 'cuenta' ? `<div class="alert warn">${icon('alert')}<div>Cotizar la toma usa <span class="mono">POST /api/v1/cotizations/external</span>. Es un <b>precio referencial</b>: cualquier oferta final debe validarse con el equipo de Ventas, las listas de precios oficiales o el CRM. <button class="btn sm secondary" style="margin-left:8px" data-action="tradein" data-id="${l.id}">Cotizar toma</button></div></div>` : ''}
  ${scope.key === 'stage' && st.key === 'cotizacion' ? `<div class="alert warn">${icon('alert')}<div>Precios, descuentos y condiciones de crédito son de referencia en la maqueta; se validan con Ventas / listas oficiales / CRM de AUTOCOM antes de enviar la cotización formal (P18).</div></div>` : ''}
  ${Object.entries(byMod).map(([m, list]) => `
    <div class="mod"><div class="mod-h" data-action="mod"><b>${esc(DATA.mods[m])}</b><span class="small muted">${list.length} campos</span></div>
      <div class="mod-b">${list.map(f => { const roles = fieldRoles(f, scope); const ro = !canEdit(roles.filter(r => !r.includes('lectura')), state.role) || /^F1(1[1-8])$/.test(f.id); return `
        <div class="field ${/comentario|notas/i.test(f.n) ? 'full' : ''}" style="${/comentario|notas/i.test(f.n) ? 'grid-column:1/-1' : ''}">
          <label><span class="mono muted">${f.id}</span>${esc(f.n)} ${roles.map(r => `<span class="role ${roleCls(r)} ${r.includes('lectura') ? 'ro' : ''}">${esc(r.replace(' (lectura)', ' · lectura'))}</span>`).join('')}</label>
          ${control(f, l, ro)}
        </div>`; }).join('')}</div></div>`).join('') || '<div class="empty">No hay campos de este rol en este alcance. Activa “Ver campos de otros roles”.</div>'}`;
}

/** Pestaña "Toques del journey": cadencia de 35 días + toques de la etapa y transversales. */
function tabCadencia(l) {
  const st = STAGES[l.stage];
  const cadDays = {}; CADENCE.forEach(c => { cadDays[c.day] = cadDays[c.day] || new Set(); cadDays[c.day].add(c.touch?.channel === 'Llamada' ? 'call' : 'wa'); });
  const list = (touches) => touches.map(t => { const done = l.done.has(t.key); const nxt = nextAction(l)?.touch?.key === t.key; return `
    <div class="tl ${done ? 'done' : nxt ? 'next' : ''}"><div class="b">${done ? icon('check','sm') : icon(CH[t.channel]?.[0] || 'flag','sm')}</div>
